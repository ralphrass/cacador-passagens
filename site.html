<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caçador de Passagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma coluna de celular (até 520px), como um app. A régua de quatro zonas é o elemento que se repete em tudo: no cartão de oportunidade, na lista e na tela do trecho. */
:root {
  --bg: #f2f3f7; --card: #ffffff; --ink: #14161f; --muted: #646b7d; --line: #e6e8ef; --soft: #f2f3f7;
  --accent: #2747e6; --accent-soft: #e8ecff;
  --z1: #0f9d58; --z2: #8bbf2f; --z3: #f2b01e; --z4: #e5484d;
  --z1-soft: #e2f5ea; --z2-soft: #eef6dc; --z3-soft: #fdf2d4; --z4-soft: #fde5e6;
  --f: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1016; --card: #181b24; --ink: #eef0f6; --muted: #9aa1b3; --line: #272b38; --soft: #20242f;
  --accent: #8ea2ff; --accent-soft: #1f2748;
  --z1: #34c27d; --z2: #a6d84a; --z3: #f5c13d; --z4: #f2686c;
  --z1-soft: #12301f; --z2-soft: #263113; --z3-soft: #34290f; --z4-soft: #3a191b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1016; --card: #181b24; --ink: #eef0f6; --muted: #9aa1b3; --line: #272b38; --soft: #20242f;
  --accent: #8ea2ff; --accent-soft: #1f2748;
  --z1: #34c27d; --z2: #a6d84a; --z3: #f5c13d; --z4: #f2686c;
  --z1-soft: #12301f; --z2-soft: #263113; --z3-soft: #34290f; --z4-soft: #3a191b; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f); font-variant-numeric: tabular-nums; }
#app { max-width: 520px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.peq { font-size: 13px; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border-radius: 20px; padding: 18px; }
.sec { display: grid; gap: 10px; }
.sec-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-cab button { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }

/* busca */
.busca { position: relative; }
.busca input { width: 100%; font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--card); border: 0; border-radius: 999px; padding: 15px 18px 15px 46px; }
.busca svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); }
.sugestoes { background: var(--card); border-radius: 16px; margin-top: 6px; overflow: hidden; }
.sugestoes a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px; text-decoration: none; border-top: 1px solid var(--line); }
.sugestoes a:first-child { border-top: 0; }

/* régua */
.regua { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--z1), var(--z2) 35%, var(--z3) 68%, var(--z4)); }
.regua i { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--card); border: 5px solid var(--ink); }
.regua.mini { height: 6px; }
.regua.mini i { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-width: 3px; }
.zonas { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.zonas span:nth-child(2), .zonas span:nth-child(3) { text-align: center; } .zonas span:nth-child(4) { text-align: right; }
.zonas .on { color: var(--ink); font-weight: 700; }
.selo { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.selo.z1 { background: var(--z1-soft); color: var(--z1); } .selo.z2 { background: var(--z2-soft); color: var(--z1); }
.selo.z3 { background: var(--z3-soft); color: var(--ink); } .selo.z4 { background: var(--z4-soft); color: var(--z4); }

/* cartão de oportunidade */
.op { display: grid; gap: 14px; text-decoration: none; }
.op-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.op-dest { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.op-dest small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.op-preco { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.op-preco b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.op-preco s { color: var(--muted); }
.op-preco em { font-style: normal; font-weight: 700; color: var(--z1); }
.datas { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.datas span { font-size: 13px; font-weight: 600; background: var(--soft); border-radius: 8px; padding: 4px 9px; }
.datas .mais { background: none; color: var(--muted); font-weight: 500; padding-left: 2px; }
.datas .rot { background: none; padding: 0; color: var(--muted); font-weight: 500; width: 52px; }

/* linhas compactas */
.rotas { padding: 4px 18px; }
.rota { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); text-decoration: none; }
.rota:first-child { border-top: 0; }
.rota b { font-weight: 700; } .rota small { display: block; color: var(--muted); font-size: 12.5px; }
.rota .v { text-align: right; font-weight: 700; }

/* tela do trecho */
.voltar { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--muted); font-weight: 600; text-decoration: none; }
.div { height: 1px; background: var(--line); margin: 18px -18px; }
.par { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.par .rot { font-weight: 600; } .par .val { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.monitor { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.monitor[aria-pressed="true"] { background: var(--accent); color: var(--card); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.duo div small { display: block; color: var(--muted); font-size: 13px; } .duo div b { font-size: 18px; font-weight: 800; }
.meses { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px; scrollbar-width: none; }
.meses button { flex: 0 0 auto; background: var(--soft); border: 2px solid transparent; border-radius: 14px; padding: 8px 12px; text-align: left; cursor: pointer; }
.meses button[aria-pressed="true"] { border-color: var(--ink); background: var(--card); }
.meses small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.meses b { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.pt { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; padding-bottom: 2px; }
.dia { border-radius: 10px; padding: 5px 0 6px; text-align: center; background: var(--soft); min-height: 44px; border: 2px solid transparent; }
.dia small { display: block; font-size: 11px; color: var(--muted); }
.dia b { font-size: 11.5px; font-weight: 700; letter-spacing: -0.02em; }
.dia.z1 { background: var(--z1-soft); } .dia.z2 { background: var(--z2-soft); } .dia.z3 { background: var(--z3-soft); } .dia.z4 { background: var(--z4-soft); }
a.dia { display: block; text-decoration: none; }
.dia.vazio { background: none; } .dia.sem b { color: var(--muted); font-weight: 500; }
.dia.melhor { border-color: var(--z1); }
.leg { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.tl { display: grid; gap: 0; }
.tl-i { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.tl-i:last-child { padding-bottom: 0; }
.tl-i::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; border-left: 2px dashed var(--line); }
.tl-i:last-child::before { display: none; }
.ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); }
.ico.sobe { background: var(--z4-soft); color: var(--z4); } .ico.varia { background: var(--z3-soft); color: var(--ink); } .ico.desce { background: var(--z1-soft); color: var(--z1); }
.tl-i b { display: block; font-weight: 700; }
.graf { position: relative; }
.graf svg { display: block; width: 100%; height: auto; overflow: visible; }
.graf [hidden] { display: none; }
.graf .eixo { font-family: var(--f); font-size: 11px; fill: var(--muted); }
.graf .grade { stroke: var(--line); }
.graf .serie { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.graf .media { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.graf .mira { stroke: var(--muted); stroke-dasharray: 3 3; }
.graf .foco { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.dica { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -140%); }
.btn { display: block; text-align: center; background: var(--ink); color: var(--card); border-radius: 999px; padding: 14px; font-weight: 700; text-decoration: none; }
.rodape { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.9; }
</style>
</head>
<body>
<div id="app"><p class="muted">Carregando preços…</p></div>

<script>
const DIA = 864e5, MIN_HIST = 5;   // a média do trecho exige 5 coletas
const NOMES_MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const BANDEIRA = {LIS:"🇵🇹",OPO:"🇵🇹",MAD:"🇪🇸",BCN:"🇪🇸",PAR:"🇫🇷",ROM:"🇮🇹",MIL:"🇮🇹",LON:"🇬🇧",FRA:"🇩🇪",MUC:"🇩🇪",BER:"🇩🇪",AMS:"🇳🇱",DUB:"🇮🇪",ZRH:"🇨🇭",VIE:"🇦🇹",ATH:"🇬🇷",IST:"🇹🇷",
  BUE:"🇦🇷",MVD:"🇺🇾",SCL:"🇨🇱",LIM:"🇵🇪",BOG:"🇨🇴",MIA:"🇺🇸",NYC:"🇺🇸",ORL:"🇺🇸",CUN:"🇲🇽"};
let D = null, HOJE = 0, FUT = 180, TRECHOS = [], porCod = {}, porId = {};
let todasAbertas = false, busca = "", mesSel = null, erro = "";

const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => v == null ? "—" : "R$ " + Math.round(v).toLocaleString("pt-BR");
const idx = s => Math.round((Date.parse(s) - HOJE) / DIA);
const iso = i => new Date(HOJE + i * DIA).toISOString().slice(0, 10);
const dm = i => new Date(HOJE + i * DIA).toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit", timeZone: "UTC"});
const quantil = (a, q) => { const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q, i = Math.floor(p); return s[i] + ((s[i + 1] ?? s[i]) - s[i]) * (p - i); };
const dur = (t, i) => idx(t.info[i][0]) - i;
const voo = (t, i) => [t.info[i][1], t.info[i][2] ? `${t.info[i][2]} escala${t.info[i][2] > 1 ? "s" : ""}` : "direto"].filter(Boolean).map(esc).join(" · ");
const nome = t => `${esc(t.nome)} ${BANDEIRA[t.cod] || "🇧🇷"}`;
const google = (t, i) => `https://www.google.com/travel/flights?hl=pt-BR&curr=BRL&q=Flights+to+${t.cod}+from+${t.origem === "SAO" ? "Sao+Paulo" : t.origem}+on+${iso(i)}+through+${t.info[i][0]}`;

function preparar(d) {
  D = d; HOJE = Date.parse(d.hoje); FUT = d.futuro;
  TRECHOS = d.trechos.map(r => {
    const t = {...r, fut: Array(FUT + 1).fill(null), info: Array(FUT + 1).fill(null)};
    for (const [dia, v] of Object.entries(r.futuro)) { const i = idx(dia); if (i >= 0 && i <= FUT) { t.fut[i] = v[0]; t.info[i] = v.slice(1); } }
    t.hist = r.historico.map(([dia, y]) => ({x: idx(dia), y}));
    const ys = t.hist.map(p => p.y), validos = t.fut.filter(p => p != null);
    t.atual = validos.length ? Math.min(...validos) : null;
    t.melhorDia = t.atual == null ? null : t.fut.indexOf(t.atual);
    t.media = ys.length >= MIN_HIST ? Math.round(quantil(ys, .5)) : null;
    t.maior = ys.length ? Math.max(...ys) : null;
    t.regras = d.regras.filter(g => g.rota_id === r.id);
    return t;
  });
  porCod = Object.fromEntries(TRECHOS.map(t => [t.cod, t])); porId = Object.fromEntries(TRECHOS.map(t => [t.id, t]));
}

// ---------- régua: uma só medida (quanto abaixo ou acima da média) em quatro zonas ----------
const ZONAS = [{id: "z1", nome: "Ótima oferta", frase: "os preços estão muito baixos"}, {id: "z2", nome: "Bom preço", frase: "os preços estão baixos"},
               {id: "z3", nome: "Preço justo", frase: "os preços estão normais"}, {id: "z4", nome: "Espere", frase: "os preços estão altos"}];
const BOM = .08, OTIMO = .2;
const desc = (t, p = t.atual) => t.media == null || p == null ? null : 1 - p / t.media;
const zona = d => ZONAS[d >= OTIMO ? 0 : d >= BOM ? 1 : d >= -BOM ? 2 : 3];
const posicao = d => { const pts = [[.4, 2], [OTIMO, 25], [BOM, 50], [-BOM, 75], [-.3, 98]];      // % na régua
  if (d >= pts[0][0]) return 2; if (d <= pts[4][0]) return 98;
  for (let i = 0; i < 4; i++) if (d <= pts[i][0] && d >= pts[i + 1][0]) return pts[i][1] + (pts[i][0] - d) / (pts[i][0] - pts[i + 1][0]) * (pts[i + 1][1] - pts[i][1]); };
const regua = (d, mini) => `<div class="regua${mini ? " mini" : ""}" role="img" aria-label="${zona(d).nome}"><i style="left:${posicao(d).toFixed(0)}%"></i></div>`;
const idasBoas = t => t.fut.map((p, i) => ({i, p})).filter(o => o.p != null && o.p <= t.atual * 1.04).map(o => o.i);
const situacao = t => t.atual == null ? "Sem preço na última coleta" : t.media == null ? "Juntando histórico" : zona(desc(t)).nome;

const app = document.getElementById("app");
const SETA = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const BINOC = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="15.5" r="3.5"/><circle cx="17.5" cy="15.5" r="3.5"/><path d="M10 15.5h4M6 12l2-7h2v9M18 12l-2-7h-2v9"/></svg>`;
const RODAPE = `<p class="rodape">Preços de ida e volta, por pessoa, saindo de São Paulo.<br><a href="chat">Assistente</a> · <a href="#coletas">Coletas e avisos</a></p>`;

function cartao(t) {
  const d = desc(t), z = zona(d), idas = idasBoas(t), vis = idas.slice(0, 4), i = t.melhorDia;
  return `<a class="card op" href="#trecho-${t.cod}">
    <div class="op-topo"><div class="op-dest">${nome(t)}<small>${voo(t, i)} · ${dur(t, i)} dias</small></div><span class="selo ${z.id}">${z.nome}</span></div>
    <div class="op-preco"><b>${brl(t.atual)}</b><s>${brl(t.media)}</s><em>−${Math.round(d * 100)}%</em></div>
    ${regua(d, true)}
    <div class="datas"><span class="rot">Ida em</span>${vis.map(k => `<span>${dm(k)}</span>`).join("")}${idas.length > 4 ? `<span class="mais">+${idas.length - 4} datas</span>` : ""}</div>
  </a>`;
}
const linha = t => { const d = desc(t); return `<a class="rota" href="#trecho-${t.cod}"><span><b>${esc(t.nome)}</b><small>${situacao(t)}</small></span>${d == null ? "<span></span>" : regua(d, true)}<span class="v">${brl(t.atual)}</span></a>`; };

function inicio() {
  const ops = TRECHOS.filter(t => desc(t) >= BOM).sort((a, b) => desc(b) - desc(a));
  const mostradas = todasAbertas ? ops : ops.slice(0, 3);
  const mon = TRECHOS.filter(t => t.regras.length);
  const semMedia = TRECHOS.filter(t => t.media == null).length;
  app.innerHTML = `
    <div><p class="muted peq" style="font-weight:600">Saindo de São Paulo</p><h1>Para onde você quer ir?</h1></div>
    <div class="busca">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cidade ou aeroporto" autocomplete="off" aria-label="Buscar destino" value="${esc(busca)}">
      <div id="sug"></div>
    </div>
    <section class="sec"><div class="sec-cab"><h2>Melhores oportunidades agora</h2>${ops.length > 3 ? `<button id="todas">${todasAbertas ? "Ver menos" : `Ver todas (${ops.length})`}</button>` : ""}</div>
      ${mostradas.map(cartao).join("") || `<div class="card muted">Nenhum trecho está abaixo da média agora.${semMedia ? ` ${semMedia} ${semMedia === 1 ? "trecho ainda está" : "trechos ainda estão"} juntando histórico para ter uma média.` : ""}</div>`}</section>
    <section class="sec"><div class="sec-cab"><h2>Você está monitorando</h2></div>
      <div class="card rotas">${mon.map(linha).join("") || `<p class="muted" style="padding:14px 0">Abra um destino e toque em Monitorar para receber avisos por e-mail.</p>`}</div></section>
    <section class="sec"><div class="sec-cab"><h2>Todos os destinos</h2></div>
      <div class="card rotas">${TRECHOS.map(linha).join("")}</div></section>
    ${RODAPE}`;
  const q = document.getElementById("q"), sug = document.getElementById("sug");
  const sugerir = () => { const f = q.value.trim().toLowerCase(); busca = q.value;
    const r = f ? TRECHOS.filter(t => t.nome.toLowerCase().includes(f) || t.cod.toLowerCase().includes(f)).slice(0, 6) : [];
    sug.innerHTML = f ? `<div class="sugestoes">${r.map(t => `<a href="#trecho-${t.cod}"><span><b>${esc(t.nome)}</b> ${BANDEIRA[t.cod] || "🇧🇷"}</span><span class="muted">${t.atual == null ? "sem preço" : "a partir de " + brl(t.atual)}</span></a>`).join("") || `<a><span class="muted">Ainda não acompanhamos esse destino.</span></a>`}</div>` : ""; };
  q.oninput = sugerir; sugerir();
  const b = document.getElementById("todas"); if (b) b.onclick = () => { todasAbertas = !todasAbertas; inicio(); };
}

async function recarregar() { preparar(await (await fetch("api/dados")).json()); }
async function alternarMonitor(t) {
  try {
    if (t.regras.length) { for (const g of t.regras) { const r = await fetch("api/alertas/" + g.id, {method: "DELETE"}); if (!r.ok && r.status !== 404) throw 0; } }
    else { const limite = Math.round((t.media != null ? t.media * (1 - BOM) : t.atual * .95) / 10) * 10;
      const r = await fetch("api/alertas", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({rota_id: t.id, preco_max: limite, mes_de: 1, mes_ate: 12})}); if (!r.ok) throw 0; }
    await recarregar();
  } catch { erro = "Não consegui salvar agora. Tente de novo."; }
  const y = scrollY; trecho(t.cod); scrollTo(0, y);
}

function trecho(cod) {
  const t = porCod[cod]; if (!t) return inicio();
  const d = desc(t), z = d == null ? null : zona(d), on = t.regras.length > 0, i0 = t.melhorDia;
  const topo = `<a class="voltar" href="#inicio">${SETA} Início</a>
    <div><p class="muted peq" style="font-weight:600">São Paulo para</p><h1>${nome(t)}</h1></div>`;
  if (t.atual == null) { app.innerHTML = topo + `<div class="card"><h2>Sem preço na última coleta</h2><p class="muted" style="margin-top:4px">A fonte não devolveu voos para este trecho. Ele volta a aparecer na próxima coleta com preço.</p></div>${RODAPE}`; return; }
  const meses = []; t.fut.forEach((p, i) => { if (p == null) return; const dt = new Date(HOJE + i * DIA), k = dt.getUTCFullYear() * 12 + dt.getUTCMonth();
    let m = meses.find(x => x.k === k); if (!m) meses.push(m = {k, mes: dt.getUTCMonth(), ano: dt.getUTCFullYear(), min: p}); m.min = Math.min(m.min, p); });
  if (mesSel == null || !meses.find(m => m.k === mesSel)) mesSel = meses.reduce((a, b) => b.min < a.min ? b : a).k;
  const m = meses.find(x => x.k === mesSel), ini = Date.UTC(m.ano, m.mes, 1), nd = new Date(Date.UTC(m.ano, m.mes + 1, 0)).getUTCDate(), dow = new Date(ini).getUTCDay();
  const zid = p => d == null ? "" : zona(desc(t, p)).id;
  const dias = Array.from({length: nd}, (_, k) => { const i = Math.round((ini + k * DIA - HOJE) / DIA), p = i >= 0 && i <= FUT ? t.fut[i] : null;
    return p == null ? `<div class="dia sem"><small>${k + 1}</small><b>·</b></div>`
      : `<a class="dia ${zid(p)}${p === m.min ? " melhor" : ""}" href="${google(t, i)}" target="_blank" rel="noopener" title="${dm(i)} a ${dm(i + dur(t, i))}: ${brl(p)}, ${voo(t, i)}"><small>${k + 1}</small><b>${Math.round(p).toLocaleString("pt-BR")}</b></a>`; }).join("");
  const previsao = d == null ? null : d >= BOM
    ? [["desce", "Agora", `O preço está ${Math.round(d * 100)}% abaixo da média. Quedas assim costumam durar poucos dias.`], ["sobe", "Se esperar", `O mais provável é voltar para perto da média, cerca de ${brl(Math.round((t.media - t.atual) / 10) * 10)} a mais.`]]
    : d >= -BOM ? [["varia", "Agora", "O preço está perto da média. Não há sinal de queda nem de alta."], ["sobe", "Perto da viagem", `Nos últimos 90 dias este trecho chegou a ${brl(t.maior)}. A menos de 30 dias da ida, costuma encarecer.`]]
    : [["sobe", "Agora", `O preço está ${Math.round(-d * 100)}% acima da média.`], ["desce", "Se puder esperar", `A média dos últimos 90 dias é ${brl(t.media)}. Monitore para ser avisado quando voltar a esse nível.`]];
  const ICO = {sobe: "M5 17l6-6 4 4 5-7M15 8h5v5", desce: "M5 7l6 6 4-4 5 7M15 16h5v-5", varia: "M4 12h4l3-5 4 10 3-5h2"};
  const NIVEL = {low: "baixo", typical: "normal", high: "alto"}, g = t.google;
  const limite = on ? Math.max(...t.regras.map(r => r.preco_max)) : null;
  app.innerHTML = topo + `
    <div class="card">
      ${d == null ? `<h2>Ainda juntando histórico</h2><p class="muted" style="margin-top:4px">Com ${MIN_HIST} dias de coleta já dá para dizer se o preço está bom. Por enquanto, veja os valores atuais abaixo.</p>`
        : `<h2>No momento, ${z.frase}</h2>
      <p class="muted" style="margin:4px 0 20px">${d >= BOM ? "Bom momento para comprar." : d >= -BOM ? "Se não tiver pressa, monitore este trecho para ver possíveis ofertas." : "Vale esperar ou olhar outras datas."}</p>
      ${regua(d)}<div class="zonas">${ZONAS.map(x => `<span class="${x === z ? "on" : ""}">${x.nome}</span>`).join("")}</div>`}
      <div class="div"></div>
      <div class="par"><div><div class="rot">Menor preço atual</div><div class="val">${brl(t.atual)}</div><div class="muted peq">Ida e volta, por pessoa · ${voo(t, i0)}<br>${dm(i0)} a ${dm(i0 + dur(t, i0))}</div></div>
        <button class="monitor" id="mon" aria-pressed="${on}">${BINOC}${on ? "Monitorando" : "Monitorar"}</button></div>
      ${on ? `<p class="muted peq" style="margin-top:10px">Você recebe um e-mail quando este trecho ficar abaixo de ${brl(limite)}.</p>` : ""}${erro ? `<p class="peq" style="margin-top:10px;color:var(--z4)">${esc(erro)}</p>` : ""}
      ${d == null ? "" : `<div class="div"></div>
      <div class="duo"><div><small>Preço médio (90 dias)</small><b>${brl(t.media)}</b></div><div><small>Maior valor no período</small><b>${brl(t.maior)}</b></div></div>`}
      ${g ? `<div class="div"></div><p class="muted peq">Conferido no Google Flights em ${dm(idx(g.em))}: ${brl(g.preco)} para ${dm(idx(g.ida))} a ${dm(idx(g.volta))}${g.nivel ? `, nível ${NIVEL[g.nivel] || esc(g.nivel)}` : ""}${g.faixa ? `, faixa típica de ${brl(g.faixa[0])} a ${brl(g.faixa[1])}` : ""}.</p>` : ""}
    </div>
    <section class="sec"><h2>Quando ir</h2>
      <div class="card" style="display:grid;gap:14px">
        <div class="meses" id="meses">${meses.map(x => `<button data-k="${x.k}" aria-pressed="${x.k === mesSel}"><small>${NOMES_MES[x.mes]}</small><b>${d == null ? "" : `<i class="pt" style="background:var(--${zid(x.min)})"></i>`}${brl(x.min)}</b></button>`).join("")}</div>
        <div class="cal">${["D","S","T","Q","Q","S","S"].map(x => `<div class="dow">${x}</div>`).join("")}${`<div class="dia vazio"></div>`.repeat(dow)}${dias}</div>
        <div class="leg">${d == null ? "" : ZONAS.map(x => `<span><i class="pt" style="background:var(--${x.id})"></i>${x.nome.toLowerCase()}</span>`).join("")}<span>preço em reais por data de ida; toque num dia para ver os voos</span></div>
      </div></section>
    ${previsao ? `<section class="sec"><h2>O que esperar</h2>
      <div class="card"><div class="tl">${previsao.map(([tipo, tit, txt]) => `<div class="tl-i"><div class="ico ${tipo}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICO[tipo]}"/></svg></div><div><b>${tit}</b><span class="muted">${txt}</span></div></div>`).join("")}</div>
      <p class="muted peq" style="margin-top:14px">Estimativa a partir do histórico do trecho. Não é uma previsão garantida.</p></div></section>` : ""}
    ${t.hist.length >= 2 ? `<section class="sec"><h2>Últimos 90 dias</h2><div class="card"><div class="graf" id="g"></div>
      <div class="leg" style="margin-top:8px"><span><i style="width:16px;height:3px;border-radius:2px;background:var(--accent)"></i>menor preço do dia</span>${t.media != null ? `<span><i style="width:16px;border-top:2px dashed var(--muted)"></i>preço médio</span>` : ""}</div></div></section>` : ""}
    <a class="btn" href="${google(t, i0)}" target="_blank" rel="noopener">Ver voos a partir de ${brl(t.atual)}</a>
    ${RODAPE}`;
  erro = "";
  document.getElementById("mon").onclick = e => { e.currentTarget.disabled = true; alternarMonitor(t); };
  document.getElementById("meses").onclick = e => { const b = e.target.closest("button"); if (b) { mesSel = +b.dataset.k; const y = scrollY; trecho(cod); scrollTo(0, y); } };
  if (t.hist.length >= 2) grafico(document.getElementById("g"), t);
}

function grafico(el, t) {
  const W = 480, H = 170, m = {l: 36, r: 6, t: 10, b: 22}, pts = t.hist, ys = pts.map(p => p.y).concat(t.media ?? []);
  const lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * .15 || 50;
  const y0 = Math.max(0, Math.floor((lo - pad) / 100) * 100), y1 = Math.ceil((hi + pad) / 100) * 100, x0 = pts[0].x, x1 = pts[pts.length - 1].x;
  const X = x => m.l + (x - x0) / ((x1 - x0) || 1) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const ult = pts[pts.length - 1], tx = [...new Set([x0, Math.round((x0 + x1) / 2), x1])];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Menor preço por dia nos últimos 90 dias">
    ${[y0, (y0 + y1) / 2, y1].map(v => `<line class="grade" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="eixo" x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${(v / 1000).toFixed(1).replace(".", ",")}k</text>`).join("")}
    ${tx.map((x, n) => `<text class="eixo" x="${X(x)}" y="${H - 4}" text-anchor="${n === 0 ? "start" : n === tx.length - 1 ? "end" : "middle"}">${dm(x)}</text>`).join("")}
    ${t.media != null ? `<line class="media" x1="${m.l}" x2="${W - m.r}" y1="${Y(t.media)}" y2="${Y(t.media)}"/>` : ""}
    <path class="serie" d="${pts.map((p, k) => (k ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join("")}"/>
    <line class="mira" y1="${m.t}" y2="${H - m.b}" hidden/><circle class="foco" r="5" cx="${X(ult.x)}" cy="${Y(ult.y)}"/></svg><div class="dica" hidden></div>`;
  const svg = el.querySelector("svg"), mira = el.querySelector(".mira"), foco = el.querySelector(".foco"), dica = el.querySelector(".dica");
  const por = p => { foco.setAttribute("cx", X(p.x)); foco.setAttribute("cy", Y(p.y)); };
  const mover = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, p = pts.reduce((a, b) => Math.abs(X(b.x) - x) < Math.abs(X(a.x) - x) ? b : a);
    mira.setAttribute("x1", X(p.x)); mira.setAttribute("x2", X(p.x)); mira.removeAttribute("hidden"); por(p);
    dica.hidden = false; dica.textContent = `${dm(p.x)}: ${brl(p.y)}`; dica.style.left = Math.max(50, Math.min(r.width - 50, X(p.x) / W * r.width)) + "px"; dica.style.top = Y(p.y) / H * r.height + "px"; };
  svg.addEventListener("pointermove", mover); svg.addEventListener("pointerdown", mover);
  svg.addEventListener("pointerleave", () => { mira.setAttribute("hidden", ""); dica.hidden = true; por(ult); });
}

function coletas() {
  const c = D.coletas, u = c.dias[0], MOTIVO = {agenda: "agenda", queda: "queda de preço", padrao: "datas padrão"}, NIVEL = {low: "baixo", typical: "normal", high: "alto"};
  const sit = d => d.trechos_ativos == null ? "" : d.trechos >= d.trechos_ativos ? `<span class="selo z1">completa</span>` : `<span class="selo z4">${d.trechos_ativos - d.trechos} sem preço</span>`;
  app.innerHTML = `<a class="voltar" href="#inicio">${SETA} Início</a>
    <div><h1>Coletas e avisos</h1><p class="muted" style="margin-top:6px">De onde vêm os números. Todo dia às 7h o sistema grava os preços de todos os trechos e confere os mais promissores no Google Flights.</p></div>
    <div class="card duo"><div><small>Última coleta</small><b>${u ? dm(idx(u.dia)) + (u.hora ? ", " + u.hora : "") : "—"}</b></div><div><small>Buscas no Google este mês</small><b>${c.buscas_no_mes} de ${c.limite_mensal}</b></div></div>
    <section class="sec"><h2>Avisos enviados</h2><div class="card rotas">${D.avisos.map(a => `<div class="rota" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${esc(porId[a.rota_id]?.nome || "—")}</b><small>${dm(idx(a.em))} · ${esc(a.motivo)} · ida ${dm(idx(a.ida))}</small></span><span class="v">${brl(a.preco)}</span></div>`).join("") || `<p class="muted" style="padding:14px 0">Nenhum aviso enviado ainda.</p>`}</div></section>
    <section class="sec"><h2>Últimos 14 dias</h2><div class="card rotas">${c.dias.map(d => `<div class="rota" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${dm(idx(d.dia))}</b><small>${d.trechos}${d.trechos_ativos != null ? " de " + d.trechos_ativos : ""} trechos · ${d.precos.toLocaleString("pt-BR")} preços · ${d.buscas} ${d.buscas === 1 ? "busca" : "buscas"} no Google · ${d.avisos} ${d.avisos === 1 ? "aviso" : "avisos"}</small></span>${sit(d)}</div>`).join("") || `<p class="muted" style="padding:14px 0">Nenhuma coleta nos últimos 14 dias.</p>`}</div></section>
    <section class="sec"><h2>Conferências no Google Flights</h2><div class="card rotas">${c.buscas.map(b => { const t = porId[b.rota_id]; return `<div class="rota" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${esc(t?.nome || "—")}</b><small>${dm(idx(b.em))} · ${MOTIVO[b.motivo] || esc(b.motivo)} · ${dm(idx(b.ida))} a ${dm(idx(b.volta))}${NIVEL[b.nivel] ? " · nível " + NIVEL[b.nivel] : ""}</small></span><span class="v">${brl(b.preco)}</span></div>`; }).join("") || `<p class="muted" style="padding:14px 0">Nenhuma conferência ainda.</p>`}</div></section>
    ${RODAPE}`;
}

function rota() { if (!D) return; const h = location.hash.slice(1);
  if (h.startsWith("trecho-")) { mesSel = null; trecho(h.slice(7)); } else if (h === "coletas") coletas(); else inicio(); scrollTo(0, 0); }
addEventListener("hashchange", rota);
recarregar().then(rota).catch(() => { app.innerHTML = `<p class="muted">Não consegui carregar os preços agora. Recarregue a página em instantes.</p>`; });
</script>
</body>
</html>
